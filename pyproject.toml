[project]
name = "search-sem"
version = "0.1.0"
description = "Semantic search engine over AI/ML arXiv abstracts — FastAPI + FAISS + sentence-transformers"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "sentence-transformers==3.0.1",
    "faiss-cpu==1.13.0",
    "numpy==1.26.4",
    "python-dotenv==1.0.1",
    "pydantic==2.8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
